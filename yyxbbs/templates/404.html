<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>用户不存在 - 普通的留言板</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.css' %}">
    <style>
        .error-container {
            margin-top: 100px;
            text-align: center;
            padding: 50px 20px;
        }
        .error-icon {
            font-size: 5rem;
            color: #e74c3c;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container error-container">
        <div class="error-icon">
            <i class="fas fa-user-slash"></i>
        </div>
        <h1>用户不存在</h1>
        <p class="lead">抱歉，您查找的用户不存在或已被删除。</p>
        <div class="mt-4">
            <a href="/board" class="btn btn-primary">返回留言板</a>
            <a href="/ranking" class="btn btn-outline-primary">查看排行榜</a>
        </div>
    </div>
</body>
</html>
